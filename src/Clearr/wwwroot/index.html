<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clearr</title>
    <link rel="icon" href="ui/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="ui/clearr-ui.css">
</head>
<body>
<div id="login" class="login hidden">
    <form id="loginForm" class="login-box">
        <img src="ui/logo.svg" alt="" class="login-logo">
        <h1>Clearr</h1>
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" autofocus>
        <button type="submit">Sign in</button>
        <div id="loginError" class="error-text"></div>
    </form>
</div>

<div id="app" class="app hidden">
    <nav class="sidebar">
        <div class="brand"><img src="ui/logo.svg" alt=""><span>Clearr</span></div>
        <a href="#shows" data-page="shows" class="nav-link">Shows</a>
        <a href="#movies" data-page="movies" class="nav-link">Movies</a>
        <a href="#history" data-page="history" class="nav-link">History</a>
        <a href="#settings" data-page="settings" class="nav-link">Settings</a>
        <div class="sidebar-foot">
            <div id="statusMode" class="mode-badge"></div>
            <div id="statusNext" class="muted small"></div>
            <div id="statusLast" class="muted small"></div>
            <div class="muted small">v<span id="version"></span></div>
            <a id="sponsor" class="sponsor hidden" target="_blank" rel="noopener">♥ Sponsor</a>
            <a href="#" id="logout" class="muted small hidden">Sign out</a>
        </div>
    </nav>
    <main class="content" id="root"></main>
</div>
<script src="ui/clearr-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
