# Weekly update pull requests for dependencies, so security fixes don't sit unnoticed.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      lint:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Moving to a new .NET major version is done by hand, together with the code and CI.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
